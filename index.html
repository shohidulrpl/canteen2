<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CTG Canteen Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%);
            --button-gradient: linear-gradient(135deg, #ff6d5a 0%, #ff3b7c 100%);
            --deep-bg: #1e1b4b; /* Deep background matching the image app canvas */
            
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--deep-bg);
            background: linear-gradient(180deg, #2b32b2 0%, #141517 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top App Bar Simulation */
        .app-bar {
            width: 100%;
            padding: 20px 20px;
            color: white;
            font-size: 18px;
            font-weight: 500;
            background-color: transparent;
            margin-bottom: 10px;
        }

        /* Main Card Container */
        .dashboard-card {
            background-color: var(--card-bg);
            width: 92%;
            max-width: 450px;
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            border-top: 10px solid #ff6d5a; /* Matching the orange top rim */
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* Header Area */
        .header {
            text-align: center;
            padding: 35px 20px 15px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* The Pink Stats Box */
        .stats-container {
            padding: 0 20px;
            margin-bottom: 25px;
        }

        .stats-box {
            background: #fff5f5;
            border: 1px solid #ffe4e1;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Blue Month Pill */
        .month-pill {
            background-color: #041499;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            width: fit-content;
            margin: 0 auto; 
        }

        /* Total Meal Display Row - Upgraded with 3D Shape */
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff; /* Perfect match to the site card background */
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            /* 3D Box Shadow Effect */
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.05),
                0 4px 6px -2px rgba(0, 0, 0, 0.025),
                inset 0 -4px 0 rgba(226, 232, 240, 0.6), /* 3D bottom depth edge */
                inset 0 2px 0 rgba(255, 255, 255, 0.9);  /* 3D top highlight */
        }

        .total-label {
            background-color: transparent; 
            color: #1e293b;
            padding: 0; 
            font-size: 17px;
            font-weight: 700;
        }

        .stats-value {
            font-size: 52px;
            line-height: 1;
            font-weight: 800;
            background: var(--button-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Date & Meal Selection Area */
        .action-area {
            padding: 0 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .select-wrapper {
            flex: 1;
        }

        .meal-wrapper {
            width: 85px;
            text-align: center;
        }

        select, input[type="text"] {
            width: 100%;
            height: 52px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            background-color: #ffffff;
            outline: none;
            padding: 0 12px;
        }

        /* Center Today's Meal text and style it */
        input[type="text"] {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #ff3b7c; 
            padding: 0;
            cursor: default;
        }

        .separator {
            padding-bottom: 15px;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Footer & Button */
        .footer {
            padding: 20px 20px 40px;
            display: flex;
            justify-content: center;
        }

        .btn-admin {
            background: var(--button-gradient);
            color: #ffffff;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(255, 59, 124, 0.4);
            border: none;
            transition: transform 0.2s;
        }

        .btn-admin:active {
            transform: scale(0.96);
        }
        
        .loading {
            opacity: 0.5;
            animation: pulse 1.5s infinite;
            font-size: 20px !important;
            -webkit-text-fill-color: var(--text-muted);
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

    </style>
</head>
<body>

    <div class="app-bar">CTG Canteen</div>

    <div class="dashboard-card">
        <div class="header">
            <h1>🍽️ Chattogram Canteen</h1>
            <p>Menu & Database Management</p>
        </div>

        <div class="stats-container">
            <div class="stats-box">
                <!-- ID added to dynamically inject the month name -->
                <div class="month-pill" id="dynamic-month-pill">Month: Loading...</div>
                
                <!-- 3D Row Section -->
                <div class="total-row">
                    <div class="total-label">Total Meal:</div>
                    <div class="stats-value" id="total-meal-display">--</div>
                </div>
            </div>
        </div>

        <div class="action-area">
            <div class="input-group select-wrapper">
                <label for="date-select">SELECT DATE</label>
                <select id="date-select">
                    <!-- Options populated dynamically by JS -->
                </select>
            </div>

            <div class="separator">-</div>

            <div class="input-group meal-wrapper">
                <label for="meal-input">TODAY'S<br>MEAL</label>
                <input type="text" id="meal-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="footer">
            <!-- Strict Link Preservation -->
            <a href="https://n8n-56.onrender.com/form/c0ea6a12-534c-4d0c-a468-ce8ada5bf51a" class="btn-admin">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Admin Login
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateSelect = document.getElementById('date-select');
            const totalMealDisplay = document.getElementById('total-meal-display');
            const dailyMealInput = document.getElementById('meal-input');
            const dynamicMonthPill = document.getElementById('dynamic-month-pill');
            
            // --- Dynamic Date Logic ---
            const monthNamesFull = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const monthNamesShort = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sept", "Oct", "Nov", "Dec"];
            
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonthIndex = today.getMonth(); 
            const todayDay = today.getDate();

            // 1. Update the Month Pill text dynamically
            dynamicMonthPill.textContent = `Month: ${monthNamesFull[currentMonthIndex]} ${currentYear}`;

            // 2. Get correct number of days in the current month dynamically
            const daysInMonth = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
            const formattedMonthString = (currentMonthIndex + 1).toString().padStart(2, '0');

            // 3. Populate Dropdown dynamically based on current month/year
            for (let i = 1; i <= daysInMonth; i++) {
                const option = document.createElement('option');
                const formattedDate = `${currentYear}-${formattedMonthString}-${i.toString().padStart(2, '0')}`;
                option.value = formattedDate;
                
                let suffix = "th";
                if (i % 10 === 1 && i !== 11) suffix = "st";
                else if (i % 10 === 2 && i !== 12) suffix = "nd";
                else if (i % 10 === 3 && i !== 13) suffix = "rd";
                
                let displayText = `${i}${suffix} ${monthNamesShort[currentMonthIndex]}`;
                if (i === todayDay) displayText += " (Today)";
                
                option.textContent = displayText;
                dateSelect.appendChild(option);
            }

            // Auto-Select Current Date in the dropdown
            const todayFormatted = `${currentYear}-${formattedMonthString}-${todayDay.toString().padStart(2, '0')}`;
            dateSelect.value = todayFormatted;

            // --- Strict Webhook Logic ---
            const WEBHOOK_URL = "https://n8n-56.onrender.com/webhook/get-meal-total"; 

            function extractQuantity(data) {
                if (Array.isArray(data) && data.length > 0) {
                    return data[0].totalMealQuantity || data[0].json?.totalMealQuantity || 0;
                }
                return data.totalMealQuantity || 0;
            }

            // Fetch the overall total meal count
            async function fetchOverallTotal() {
                totalMealDisplay.innerHTML = `<span class="loading">...</span>`;
                try {
                    const response = await fetch(WEBHOOK_URL);
                    if (!response.ok) throw new Error("Network response error");
                    const data = await response.json();
                    
                    totalMealDisplay.innerHTML = extractQuantity(data);
                } catch (error) {
                    console.error("Error fetching total:", error);
                    totalMealDisplay.innerHTML = `<span style="font-size: 16px; color: var(--text-muted); -webkit-text-fill-color: var(--text-muted)">Err</span>`;
                }
            }

            // Fetch specific daily meal count based on selection
            async function fetchDailyTotal(dateQuery) {
                if (!dateQuery) return;
                
                dailyMealInput.value = "..."; 
                try {
                    const response = await fetch(`${WEBHOOK_URL}?date=${dateQuery}`);
                    if (!response.ok) throw new Error("Network response error");
                    const data = await response.json();
                    
                    dailyMealInput.value = extractQuantity(data);
                } catch (error) {
                    console.error("Error fetching daily total:", error);
                    dailyMealInput.value = "-";
                }
            }

            // Listen for date selection changes
            dateSelect.addEventListener('change', (e) => {
                fetchDailyTotal(e.target.value);
            });

            // Run initial fetches on page load
            fetchOverallTotal();
            fetchDailyTotal(todayFormatted);
        });
    </script>
</body>
</html>
